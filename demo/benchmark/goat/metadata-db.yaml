# Kubernetes Goat "metadata-db" (scenario 3, SSRF).
# Upstream installs this with `helm install metadata-db scenarios/metadata-db/`.
# Helm is not needed here: this is that chart rendered by hand with the
# chart's default values.yaml (release name metadata-db, ClusterIP port 80).
apiVersion: v1
kind: Service
metadata:
  name: metadata-db
  labels:
    app.kubernetes.io/name: metadata-db
    helm.sh/chart: metadata-db-0.1.0
    app.kubernetes.io/instance: metadata-db
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: metadata-db
    app.kubernetes.io/instance: metadata-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-db
  labels:
    app.kubernetes.io/name: metadata-db
    helm.sh/chart: metadata-db-0.1.0
    app.kubernetes.io/instance: metadata-db
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metadata-db
      app.kubernetes.io/instance: metadata-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metadata-db
        app.kubernetes.io/instance: metadata-db
    spec:
      containers:
        - name: metadata-db
          image: "madhuakula/k8s-goat-metadata-db:latest"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 30m
              memory: 60Mi
            requests:
              cpu: 30m
              memory: 60Mi
