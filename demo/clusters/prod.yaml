# kav-prod — production. HARDENED posture:
#   * Pod Security Admission "restricted" enforced on app namespaces
#   * default-deny ingress everywhere; explicit allow frontend→api→payments→redis
#   * ServiceAccount tokens not mounted (automountServiceAccountToken: false)
#   * CI runner limited to creating deployments in `shop` (namespace-scoped)
#   * patched, non-root images
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels: {team: shop, pod-security.kubernetes.io/enforce: restricted}
---
apiVersion: v1
kind: Namespace
metadata:
  name: payments
  labels: {team: payments, pod-security.kubernetes.io/enforce: restricted}
---
apiVersion: v1
kind: Namespace
metadata:
  name: ci
  labels: {team: platform, pod-security.kubernetes.io/enforce: baseline}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: frontend, namespace: shop}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: api, namespace: shop}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: payments-api, namespace: payments}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ci-runner, namespace: ci}
---
apiVersion: v1
kind: Secret
metadata: {name: db-creds, namespace: payments}
type: Opaque
stringData: {password: demo-only-not-a-real-secret}
---
apiVersion: v1
kind: Secret
metadata: {name: stripe-key, namespace: payments}
type: Opaque
stringData: {key: demo-only-not-a-real-secret}
---
apiVersion: v1
kind: Secret
metadata: {name: session-key, namespace: shop}
type: Opaque
stringData: {key: demo-only-not-a-real-secret}
---
apiVersion: v1
kind: Secret
metadata: {name: registry-token, namespace: ci}
type: Opaque
stringData: {token: demo-only-not-a-real-secret}
---
# ── Workloads (all satisfy PSS "restricted") ─────────────────────────────────
apiVersion: v1
kind: Pod
metadata: {name: frontend, namespace: shop, labels: {app: frontend}}
spec:
  serviceAccountName: frontend
  securityContext: {runAsNonRoot: true, runAsUser: 101, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: web
      image: "nginxinc/nginx-unprivileged:1.27.3"
      ports: [{containerPort: 8080}]
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Pod
metadata: {name: api, namespace: shop, labels: {app: api}}
spec:
  serviceAccountName: api
  securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: api
      image: "hashicorp/http-echo:1.0.0"
      args: ["-listen=:8080", "-text=api"]
      ports: [{containerPort: 8080}]
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      env:
        - name: SESSION_KEY
          valueFrom: {secretKeyRef: {name: session-key, key: key}}
---
apiVersion: v1
kind: Pod
metadata: {name: payments-api, namespace: payments, labels: {app: payments-api}}
spec:
  serviceAccountName: payments-api
  securityContext: {runAsNonRoot: true, runAsUser: 101, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: web
      image: "nginxinc/nginx-unprivileged:1.27.3"
      ports: [{containerPort: 8080}]
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumeMounts: [{name: db, mountPath: /etc/db, readOnly: true}]
  volumes:
    - {name: db, secret: {secretName: db-creds}}
---
apiVersion: v1
kind: Pod
metadata: {name: redis, namespace: payments, labels: {app: redis}}
spec:
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 999, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: redis
      image: "redis:7.4.1"
      ports: [{containerPort: 6379}]
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Pod
metadata: {name: ci-runner, namespace: ci, labels: {app: ci-runner, kubeattackviz.io/entry-point: supply-chain}}
spec:
  serviceAccountName: ci-runner
  containers:
    - name: runner
      image: "busybox:1.36"
      command: ["sleep", "infinity"]
      env:
        - name: REGISTRY_TOKEN
          valueFrom: {secretKeyRef: {name: registry-token, key: token}}
---
# ── Services ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: shop}
spec: {type: NodePort, selector: {app: frontend}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: shop}
spec: {selector: {app: api}, ports: [{port: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: payments-api, namespace: payments}
spec: {selector: {app: payments-api}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: payments}
spec: {selector: {app: redis}, ports: [{port: 6379}]}
---
# ── NetworkPolicies: default deny + explicit chain ───────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: shop}
spec: {podSelector: {}, policyTypes: [Ingress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: payments}
spec: {podSelector: {}, policyTypes: [Ingress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: ci}
spec: {podSelector: {}, policyTypes: [Ingress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: frontend-from-anywhere, namespace: shop}
spec:
  podSelector: {matchLabels: {app: frontend}}
  policyTypes: [Ingress]
  ingress: [{ports: [{port: 8080}]}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-from-frontend, namespace: shop}
spec:
  podSelector: {matchLabels: {app: api}}
  policyTypes: [Ingress]
  ingress: [{from: [{podSelector: {matchLabels: {app: frontend}}}], ports: [{port: 8080}]}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: payments-from-api, namespace: payments}
spec:
  podSelector: {matchLabels: {app: payments-api}}
  policyTypes: [Ingress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {team: shop}}, podSelector: {matchLabels: {app: api}}}]
      ports: [{port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: redis-from-payments-api, namespace: payments}
spec:
  podSelector: {matchLabels: {app: redis}}
  policyTypes: [Ingress]
  ingress: [{from: [{podSelector: {matchLabels: {app: payments-api}}}], ports: [{port: 6379}]}]
---
# ── RBAC: least privilege ────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: deployer, namespace: shop}
rules:
  - {apiGroups: [apps], resources: [deployments], verbs: [get, list, create, update, patch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: ci-runner-deploys-shop, namespace: shop}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: deployer}
subjects: [{kind: ServiceAccount, name: ci-runner, namespace: ci}]
---
# ── Additional hardened workloads (same restricted posture) ──────────────────
apiVersion: v1
kind: Secret
metadata: {name: checkout-signing-key, namespace: shop}
type: Opaque
stringData: {key: demo-only-not-a-real-secret}
---
apiVersion: v1
kind: Secret
metadata: {name: smtp-creds, namespace: shop}
type: Opaque
stringData: {password: demo-only-not-a-real-secret}
---
apiVersion: v1
kind: Secret
metadata: {name: ledger-creds, namespace: payments}
type: Opaque
stringData: {password: demo-only-not-a-real-secret}
---
apiVersion: v1
kind: Pod
metadata: {name: checkout, namespace: shop, labels: {app: checkout}}
spec:
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: checkout
      image: "hashicorp/http-echo:1.0.0"
      args: ["-listen=:8080", "-text=checkout"]
      ports: [{containerPort: 8080}]
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      env:
        - name: SIGNING_KEY
          valueFrom: {secretKeyRef: {name: checkout-signing-key, key: key}}
---
apiVersion: v1
kind: Pod
metadata: {name: notifier, namespace: shop, labels: {app: notifier}}
spec:
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: notifier
      image: "hashicorp/http-echo:1.0.0"
      args: ["-listen=:8080", "-text=notifier"]
      ports: [{containerPort: 8080}]
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      env:
        - name: SMTP_PASSWORD
          valueFrom: {secretKeyRef: {name: smtp-creds, key: password}}
---
apiVersion: v1
kind: Pod
metadata: {name: payments-worker, namespace: payments, labels: {app: payments-worker}}
spec:
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: worker
      image: "hashicorp/http-echo:1.0.0"
      args: ["-listen=:8080", "-text=worker"]
      ports: [{containerPort: 8080}]
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      env:
        - name: STRIPE_KEY
          valueFrom: {secretKeyRef: {name: stripe-key, key: key}}
---
apiVersion: v1
kind: Pod
metadata: {name: ledger, namespace: payments, labels: {app: ledger}}
spec:
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 101, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: ledger
      image: "nginxinc/nginx-unprivileged:1.27.3"
      ports: [{containerPort: 8080}]
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumeMounts: [{name: creds, mountPath: /etc/ledger, readOnly: true}]
  volumes:
    - {name: creds, secret: {secretName: ledger-creds}}
---
apiVersion: v1
kind: Service
metadata: {name: checkout, namespace: shop}
spec: {selector: {app: checkout}, ports: [{port: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: notifier, namespace: shop}
spec: {selector: {app: notifier}, ports: [{port: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: payments-worker, namespace: payments}
spec: {selector: {app: payments-worker}, ports: [{port: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: ledger, namespace: payments}
spec: {selector: {app: ledger}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: checkout-from-frontend, namespace: shop}
spec:
  podSelector: {matchLabels: {app: checkout}}
  policyTypes: [Ingress]
  ingress: [{from: [{podSelector: {matchLabels: {app: frontend}}}], ports: [{port: 8080}]}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: notifier-from-checkout, namespace: shop}
spec:
  podSelector: {matchLabels: {app: notifier}}
  policyTypes: [Ingress]
  ingress: [{from: [{podSelector: {matchLabels: {app: checkout}}}], ports: [{port: 8080}]}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: worker-from-checkout, namespace: payments}
spec:
  podSelector: {matchLabels: {app: payments-worker}}
  policyTypes: [Ingress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {team: shop}}, podSelector: {matchLabels: {app: checkout}}}]
      ports: [{port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ledger-from-worker, namespace: payments}
spec:
  podSelector: {matchLabels: {app: ledger}}
  policyTypes: [Ingress]
  ingress: [{from: [{podSelector: {matchLabels: {app: payments-worker}}}], ports: [{port: 8080}]}]

---
# ── Human access (each User is an entry point: a compromised credential) ─────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: breakglass-exec, namespace: payments}
rules:
  - {apiGroups: [""], resources: [pods], verbs: [get, list]}
  - {apiGroups: [""], resources: [pods/exec], verbs: [create]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: sre-carol-breakglass, namespace: payments}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: breakglass-exec}
subjects: [{kind: User, name: sre-carol, apiGroup: rbac.authorization.k8s.io}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: dev-alice-view, namespace: shop}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects: [{kind: User, name: dev-alice, apiGroup: rbac.authorization.k8s.io}]
