# kav-dev — developer sandbox. Deliberately LOOSE posture:
#   * CI runner bound to cluster-admin (ClusterRoleBinding)
#   * every ServiceAccount in `shop` can exec into pods and read secrets
#     (built-in ClusterRole `edit` bound to the namespace's SA group)
#   * privileged debug pod with host PID and the host filesystem mounted
#   * no NetworkPolicies, tokens auto-mounted everywhere
#   * older images with known CVEs (scanned by Trivy, never exploited)
#   * dev-bob still holds a "temporary" cluster-admin grant; CI runner is an entry point
apiVersion: v1
kind: Namespace
metadata: {name: shop, labels: {team: shop}}
---
apiVersion: v1
kind: Namespace
metadata: {name: payments, labels: {team: payments}}
---
apiVersion: v1
kind: Namespace
metadata: {name: ci, labels: {team: platform}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: frontend, namespace: shop}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: api, namespace: shop}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: payments-api, namespace: payments}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ci-runner, namespace: ci}
---
apiVersion: v1
kind: Secret
metadata: {name: db-creds, namespace: payments}
type: Opaque
stringData: {password: demo-only-not-a-real-secret}
---
apiVersion: v1
kind: Secret
metadata: {name: stripe-key, namespace: payments}
type: Opaque
stringData: {key: demo-only-not-a-real-secret}
---
apiVersion: v1
kind: Secret
metadata: {name: session-key, namespace: shop}
type: Opaque
stringData: {key: demo-only-not-a-real-secret}
---
apiVersion: v1
kind: Secret
metadata: {name: registry-token, namespace: ci}
type: Opaque
stringData: {token: demo-only-not-a-real-secret}
---
# ── Workloads ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata: {name: frontend, namespace: shop, labels: {app: frontend}}
spec:
  serviceAccountName: frontend
  containers:
    - {name: web, image: "nginx:1.21.6", ports: [{containerPort: 80}]}
---
apiVersion: v1
kind: Pod
metadata: {name: api, namespace: shop, labels: {app: api}}
spec:
  serviceAccountName: api
  containers:
    - name: api
      image: "hashicorp/http-echo:0.2.3"
      args: ["-listen=:8080", "-text=api"]
      ports: [{containerPort: 8080}]
      env:
        - name: SESSION_KEY
          valueFrom: {secretKeyRef: {name: session-key, key: key}}
---
apiVersion: v1
kind: Pod
metadata: {name: debug-tools, namespace: shop, labels: {app: debug}}
spec:
  hostPID: true
  containers:
    - name: tools
      image: "busybox:1.36"
      command: ["sleep", "infinity"]
      securityContext: {privileged: true}
      volumeMounts: [{name: host, mountPath: /host}]
  volumes:
    - {name: host, hostPath: {path: /}}
---
apiVersion: v1
kind: Pod
metadata: {name: payments-api, namespace: payments, labels: {app: payments-api}}
spec:
  serviceAccountName: payments-api
  containers:
    - name: httpd
      image: "httpd:2.4.49"
      ports: [{containerPort: 80}]
      volumeMounts: [{name: db, mountPath: /etc/db, readOnly: true}]
  volumes:
    - {name: db, secret: {secretName: db-creds}}
---
apiVersion: v1
kind: Pod
metadata: {name: ci-runner, namespace: ci, labels: {app: ci-runner, kubeattackviz.io/entry-point: supply-chain}}
spec:
  serviceAccountName: ci-runner
  containers:
    - name: runner
      image: "busybox:1.36"
      command: ["sleep", "infinity"]
      env:
        - name: REGISTRY_TOKEN
          valueFrom: {secretKeyRef: {name: registry-token, key: token}}
---
# ── Services ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: shop}
spec: {type: NodePort, selector: {app: frontend}, ports: [{port: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: shop}
spec: {selector: {app: api}, ports: [{port: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: payments-api, namespace: payments}
spec: {selector: {app: payments-api}, ports: [{port: 80}]}
---
# One admin binding with several subjects — the CI runner AND a developer's
# "temporary" grant that was never removed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: platform-admins}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin}
subjects:
  - {kind: ServiceAccount, name: ci-runner, namespace: ci}
  - {kind: User, name: dev-bob, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: shop-everyone-edit, namespace: shop}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edit}
subjects: [{kind: Group, name: "system:serviceaccounts:shop", apiGroup: rbac.authorization.k8s.io}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: read-db-creds, namespace: payments}
rules:
  - {apiGroups: [""], resources: [secrets], verbs: [get, list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: api-reads-payments-secrets, namespace: payments}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: read-db-creds}
subjects: [{kind: ServiceAccount, name: api, namespace: shop}]
