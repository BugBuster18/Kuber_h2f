# Read-only identity for KubeAttackViz live scans.
#
#   kubectl apply -f deploy/scanner-rbac.yaml
#   kubectl create token kubeattackviz-scanner -n kubeattackviz   # short-lived token
#
# Grants get/list on exactly the resources ingestion.KUBECTL_RESOURCES reads.
# Secrets: `list` only — KubeAttackViz requests names/types via
# custom-columns and never reads values. Note that Kubernetes cannot restrict
# `list` to metadata: an identity with list on secrets *could* fetch values
# with another client, so keep this token short-lived and out of shared
# storage.
apiVersion: v1
kind: Namespace
metadata:
  name: kubeattackviz
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeattackviz-scanner
  namespace: kubeattackviz
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeattackviz-scanner
rules:
  - apiGroups: [""]
    resources: [namespaces, nodes, pods, services, serviceaccounts, configmaps]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, clusterroles, rolebindings, clusterrolebindings]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeattackviz-scanner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeattackviz-scanner
subjects:
  - kind: ServiceAccount
    name: kubeattackviz-scanner
    namespace: kubeattackviz
